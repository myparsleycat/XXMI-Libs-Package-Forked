name: Release


on:
  push:
    tags:
      - 'v*-nhd.*'
  # Builds without creating a release
  workflow_dispatch:


permissions:
  contents: write


jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # generate-version.ps1, which the build runs, reads the version from the tags
        fetch-depth: 0

    - name: Add MSBuild for VS2022 to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'

    - name: Build d3d11.dll
      run: >
        msbuild StereoVisionHacks.sln
        -target:DirectX11:Rebuild
        -maxCpuCount
        -property:Configuration=Release
        -property:Platform=x64
        -verbosity:minimal

    - name: Upload DLL and symbols
      uses: actions/upload-artifact@v4
      with:
        name: d3d11-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        path: |
          x64/Release/d3d11.dll
          x64/Release/d3d11.pdb
        if-no-files-found: error

    - name: Create draft release
      if: github.event_name == 'push' && github.ref_type == 'tag'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $assets = @(./tools/release-assets.ps1)

        # The package zips are not built here; every release carries over the previous release's
        $previous = gh release view -R $env:GITHUB_REPOSITORY --json tagName,assets | ConvertFrom-Json
        if ($previous.assets.name -like '*.zip') {
          gh release download $previous.tagName -R $env:GITHUB_REPOSITORY -p '*.zip' -D carry
          $assets += @(Get-ChildItem carry -Filter *.zip | ForEach-Object FullName)
        } else {
          Write-Warning "$($previous.tagName) has no zip assets to carry over"
        }

        # A re-run fills the draft the failed run left instead of making a second one.
        # Listing (drafts included) keeps "no release" apart from a failed request,
        # which gh release view <tag> reports with the same exit code.
        $existing = gh release list -R $env:GITHUB_REPOSITORY --json tagName,isDraft | ConvertFrom-Json | Where-Object tagName -eq $env:TAG
        if ($existing | Where-Object { -not $_.isDraft }) {
          throw "$env:TAG is already published; not replacing its assets"
        }
        if ($existing) {
          gh release upload $env:TAG -R $env:GITHUB_REPOSITORY --clobber @assets
        } else {
          gh release create $env:TAG -R $env:GITHUB_REPOSITORY --draft --verify-tag --title $env:TAG --notes '' @assets
        }
