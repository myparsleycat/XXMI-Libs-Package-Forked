name: Release


on:
  push:
    tags:
      - 'v*'
  # Builds without creating a release
  workflow_dispatch:


permissions:
  contents: write


jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # generate-version.ps1, which the build runs, reads the version from the tags
        fetch-depth: 0

    - name: Add MSBuild for VS2022 to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'

    - name: Build d3d11.dll
      run: >
        msbuild StereoVisionHacks.sln
        -target:DirectX11:Rebuild
        -property:Configuration=Release
        -property:Platform=x64
        -verbosity:minimal

    - name: Upload DLL and symbols
      uses: actions/upload-artifact@v4
      with:
        name: d3d11-${{ github.ref_name }}
        path: |
          x64/Release/d3d11.dll
          x64/Release/d3d11.pdb
        if-no-files-found: error

    - name: Create draft release
      if: github.ref_type == 'tag'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $assets = @(./tools/release-assets.ps1)

        # The package zips are not built here; every release carries over the previous release's
        $previous = gh release view -R $env:GITHUB_REPOSITORY --json tagName -q .tagName
        gh release download $previous -R $env:GITHUB_REPOSITORY -p '*.zip' -D carry
        $assets += @(Get-ChildItem carry -Filter *.zip | ForEach-Object FullName)

        gh release create $env:TAG -R $env:GITHUB_REPOSITORY --draft --verify-tag --title $env:TAG --notes '' @assets
