namespace = RabbitFX

; DX12 adapter for RabbitFX 7.10's native ZZZ toon shader path. The adapter
; shares RabbitFX's namespace so the original mod remains unmodified and
; replaceable.
[ShaderRegexDX12NativeToonGlow]
shader_model = ps_6_0
dx12_match_registers = t0 t1 t2 t3 t4 t5 t6 t7 t8
dx12_match_render_targets = 4
dx12_match_cb0_size = 3392
dx12_match_cb1_size = 464
dx12_match_cb2_size = 656
dx12_match_cb3_size = 2036
filter_index = 172187.1
post run = CommandListClear
post run = CommandListUpdateFXBuffer

[ShaderRegexDX12NativeToonGlow.InsertDeclarations]
dcl_resource_texture1d (float,float,float,float) t120
dcl_resource_texture2d (float,float,float,float) t60

[ShaderRegexDX12NativeToonGlow.DxilPatternA]
(?s)\A(?=.*shader hash: (?:1cadfbdc4d96f8a80105313753c71056|eccc9166e319fb595f23703d3e2f4d85))(?=.*@toonFragment).*?\K
(?<r0line>  call void @dx\.op\.storeOutput\.f32\(i32 5, i32 0, i32 0, i8 0, float )(?<r0>%\d+)(?<r0tail>\).*?\n)
(?<g0line>  call void @dx\.op\.storeOutput\.f32\(i32 5, i32 0, i32 0, i8 1, float )(?<g0>%\d+)(?<g0tail>\).*?\n)
(?<b0line>  call void @dx\.op\.storeOutput\.f32\(i32 5, i32 0, i32 0, i8 2, float )(?<b0>%\d+)(?<b0tail>\).*?\n)
(?<a0line>  call void @dx\.op\.storeOutput\.f32\(i32 5, i32 0, i32 0, i8 3, float )(?<a0>(?:%\d+|[-+0-9.eE]+))(?<a0tail>\).*?\n)
(?<r1line>  call void @dx\.op\.storeOutput\.f32\(i32 5, i32 1, i32 0, i8 0, float )(?<r1>%\d+)(?<r1tail>\).*?\n)
(?<g1line>  call void @dx\.op\.storeOutput\.f32\(i32 5, i32 1, i32 0, i8 1, float )(?<g1>%\d+)(?<g1tail>\).*?\n)
(?<b1line>  call void @dx\.op\.storeOutput\.f32\(i32 5, i32 1, i32 0, i8 2, float )(?<b1>%\d+)(?<b1tail>\).*?\n)
(?<a1line>  call void @dx\.op\.storeOutput\.f32\(i32 5, i32 1, i32 0, i8 3, float )(?<a1>%\d+)(?<a1tail>\).*?\n)

[ShaderRegexDX12NativeToonGlow.DxilPatternA.Replace]
%zz_glow = call %dx.types.ResRet.f32 @dx.op.sampleBias.f32(i32 61, %dx.types.Handle %zz_d3dmigoto_t60, %dx.types.Handle %13, float %111, float %112, float undef, float undef, i32 0, i32 0, i32 undef, float 0.000000e+00, float undef)\n
%zz_r0 = extractvalue %dx.types.ResRet.f32 %zz_glow, 0\n
%zz_g0 = extractvalue %dx.types.ResRet.f32 %zz_glow, 1\n
%zz_b0 = extractvalue %dx.types.ResRet.f32 %zz_glow, 2\n
%zz_a0 = extractvalue %dx.types.ResRet.f32 %zz_glow, 3\n
%zz_enabled = fcmp fast one float %zz_a0, 0.000000e+00\n
%zz_r1 = fmul fast float %zz_r0, %zz_a0\n
%zz_g1 = fmul fast float %zz_g0, %zz_a0\n
%zz_b1 = fmul fast float %zz_b0, %zz_a0\n
%zz_ini = call %dx.types.ResRet.f32 @dx.op.textureLoad.f32(i32 66, %dx.types.Handle %zz_d3dmigoto_t120, i32 0, i32 217, i32 undef, i32 undef, i32 undef, i32 undef, i32 undef)\n
%zz_brightness = extractvalue %dx.types.ResRet.f32 %zz_ini, 3\n
%zz_hdr_r = fmul fast float %zz_r1, %zz_brightness\n
%zz_hdr_g = fmul fast float %zz_g1, %zz_brightness\n
%zz_hdr_b = fmul fast float %zz_b1, %zz_brightness\n
%zz_decay_arg = fmul fast float %zz_brightness, 0xBFC1B55260000000\n
%zz_decay_exp = call float @dx.op.unary.f32(i32 21, float %zz_decay_arg)\n
%zz_decay = fadd fast float 1.000000e+00, %zz_decay_exp\n
%zz_soft_r = fmul fast float %zz_r1, %zz_decay\n
%zz_soft_g = fmul fast float %zz_g1, %zz_decay\n
%zz_soft_b = fmul fast float %zz_b1, %zz_decay\n
%zz_soft_a = fmul fast float %zz_decay, %zz_brightness\n
%zz_out0_r = select i1 %zz_enabled, float %zz_hdr_r, float ${r0}\n
%zz_out0_g = select i1 %zz_enabled, float %zz_hdr_g, float ${g0}\n
%zz_out0_b = select i1 %zz_enabled, float %zz_hdr_b, float ${b0}\n
%zz_out1_r = select i1 %zz_enabled, float %zz_soft_r, float ${r1}\n
%zz_out1_g = select i1 %zz_enabled, float %zz_soft_g, float ${g1}\n
%zz_out1_b = select i1 %zz_enabled, float %zz_soft_b, float ${b1}\n
%zz_out1_a = select i1 %zz_enabled, float %zz_soft_a, float ${a1}\n
${r0line}%zz_out0_r${r0tail}
${g0line}%zz_out0_g${g0tail}
${b0line}%zz_out0_b${b0tail}
${a0line}${a0}${a0tail}
${r1line}%zz_out1_r${r1tail}
${g1line}%zz_out1_g${g1tail}
${b1line}%zz_out1_b${b1tail}
${a1line}%zz_out1_a${a1tail}

[ShaderRegexDX12NativeToonGlow.DxilPatternB]
(?<declaration>declare %dx\.types\.Handle @dx\.op\.createHandle\([^\n]+\n)

[ShaderRegexDX12NativeToonGlow.DxilPatternB.Replace]
declare %dx.types.ResRet.f32 @dx.op.textureLoad.f32(i32, %dx.types.Handle, i32, i32, i32, i32, i32, i32, i32) #2\n
${declaration}
