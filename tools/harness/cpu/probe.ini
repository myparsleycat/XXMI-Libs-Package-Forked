; Included by xh.sh for the harness argument redundant. Every draw with an
; index buffer binds what the game has in ps-t0 to ps-t3 as well, from a
; command list, and the harness then leaves ps-t3 as it is (redundant), so a
; later checktextureoverride of ps-t3 finds a texture the game did not bind
; there, one that the TextureOverride sections of the mods may be for.
[TextureOverrideHarnessProbe]
match_bind_flags = index_buffer
ps-t3 = ps-t0
