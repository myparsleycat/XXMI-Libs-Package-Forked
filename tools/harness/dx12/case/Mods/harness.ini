; The per-draw work an importer's main ini asks for: a ShaderRegex for every
; vertex shader that checks the texture overrides of the vertex and index
; buffers and of the first pixel shader texture, with the variables such an
; ini keeps.
[Constants]
global $costume_mods = 1
global $is_legacy = 1
global $check_textures = 2

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
run = CommandListSkin

[CommandListSkin]
if $costume_mods
	local $type = DRAW_TYPE
	if $check_textures == 2
		checktextureoverride = ps-t0
	endif
	if $is_legacy
		if $type == 2 || $type == 4
			CheckTextureOverride = vb0
			CheckTextureOverride = vb1
			CheckTextureOverride = vb2
			CheckTextureOverride = ib
		elif $type == 1 || $type == 3
			CheckTextureOverride = vb0
			CheckTextureOverride = vb2
		endif
		x140 = 0
	endif
endif
