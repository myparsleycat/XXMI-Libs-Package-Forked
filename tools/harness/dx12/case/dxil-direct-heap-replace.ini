[ShaderRegexDxilQuotedHeapTest]
shader_model = ps_6_0
dx12_match_registers = t0 t1

; LLVM permits quoted global identifiers. This spelling must not bypass the
; conservative rejection of dynamically indexed descriptor heaps.
[ShaderRegexDxilQuotedHeapTest.DxilPatternA]
(?<define>define void @ps\([^\n]*\)[^{]*\{\n)

[ShaderRegexDxilQuotedHeapTest.DxilPatternA.Replace]
${define}%zz_heap_handle = call %dx.types.Handle @"dx.op.createHandleFromHeap"(i32 218, i32 0, i1 false)\n

[ShaderRegexDxilQuotedHeapTest.DxilPatternB]
(?<declaration>declare %dx\.types\.Handle @dx\.op\.createHandle\([^\n]+\n)

[ShaderRegexDxilQuotedHeapTest.DxilPatternB.Replace]
declare %dx.types.Handle @"dx.op.createHandleFromHeap"(i32, i32, i1) #2\n
${declaration}
