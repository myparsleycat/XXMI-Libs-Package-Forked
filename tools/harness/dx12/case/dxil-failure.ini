dx12_match_registers = t0 t1

[ShaderRegexDxilFailureTest.InsertDeclarations]
dcl_resource_texture1d (float,float,float,float) t120

[ShaderRegexDxilFailureTest.DxilPatternA]
(?s)\A(?=.*define void @ps\(\)).*?\K(?<head>  call void @dx\.op\.storeOutput\.f32\(i32 5, i32 0, i32 0, i8 0, float )(?<value>%\d+)(?<tail>\).*?\n)

[ShaderRegexDxilFailureTest.DxilPatternA.Replace]
%zz_test_load = call %dx.types.ResRet.f32 @dx.op.textureLoad.f32(i32 66, %dx.types.Handle %zz_d3dmigoto_t121, i32 0, i32 172, i32 undef, i32 undef, i32 undef, i32 undef, i32 undef)\n
%zz_test_value = extractvalue %dx.types.ResRet.f32 %zz_test_load, 0\n
%zz_test_output = fadd fast float ${value}, %zz_test_value\n
${head}%zz_test_output${tail}

[ShaderRegexDxilFailureTest.DxilPatternB]
(?<declaration>declare %dx\.types\.Handle @dx\.op\.createHandle\([^\n]+\n)

[ShaderRegexDxilFailureTest.DxilPatternB.Replace]
declare %dx.types.ResRet.f32 @dx.op.textureLoad.f32(i32, %dx.types.Handle, i32, i32, i32, i32, i32, i32, i32) #2\n
${declaration}

