[ShaderRegexDxilSamplerTest]
shader_model = ps_6_0
dx12_match_registers = t0 t1

[ShaderRegexDxilSamplerTest.InsertDeclarations]
dcl_sampler s15, mode_default

[ShaderRegexDxilSamplerTest.DxilPatternA]
(?<sample>  %\d+ = call %dx\.types\.ResRet\.f32 @dx\.op\.sample\.f32\(i32 60, %dx\.types\.Handle (?<texture>%\d+), %dx\.types\.Handle %\d+, float (?<x>%\d+), float (?<y>%\d+), [^\n]+\n)

[ShaderRegexDxilSamplerTest.DxilPatternA.Replace]
%zz_sample = call %dx.types.ResRet.f32 @dx.op.sample.f32(i32 60, %dx.types.Handle ${texture}, %dx.types.Handle %zz_d3dmigoto_s15, float ${x}, float ${y}, float undef, float undef, i32 0, i32 0, i32 undef, float undef)\n
%zz_sample_r = extractvalue %dx.types.ResRet.f32 %zz_sample, 1\n
%zz_sample_delta = fmul fast float %zz_sample_r, 0.5\n
${sample}

[ShaderRegexDxilSamplerTest.DxilPatternB]
(?<head>  call void @dx\.op\.storeOutput\.f32\(i32 5, i32 0, i32 0, i8 0, float )(?<value>%\d+)(?<tail>\).*?\n)

[ShaderRegexDxilSamplerTest.DxilPatternB.Replace]
%zz_sample_output = fadd fast float ${value}, %zz_sample_delta\n
${head}%zz_sample_output${tail}
