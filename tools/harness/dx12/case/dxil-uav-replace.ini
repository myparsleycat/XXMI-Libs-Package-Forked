[ShaderRegexDxilInjectedUavTest]
shader_model = ps_6_0
dx12_match_registers = t0 t1

; Deliberately bypass InsertDeclarations: inject a writable UAV entirely from
; replacement text. Release builds must reject the assembled result.
[ShaderRegexDxilInjectedUavTest.DxilPatternA]
(?<define>define void @ps\([^\n]*\)[^{]*\{\n)

[ShaderRegexDxilInjectedUavTest.DxilPatternA.Replace]
%struct.RWByteAddressBuffer = type { i32 }\n
${define}%zz_injected_uav = call %dx.types.Handle @dx.op.createHandle(i32 57, i8 1, i32 0, i32 4, i1 false)\n
%zz_injected_old = call i32 @dx.op.atomicBinOp.i32(i32 78, %dx.types.Handle %zz_injected_uav, i32 8, i32 0, i32 undef, i32 undef, i32 1)\n

[ShaderRegexDxilInjectedUavTest.DxilPatternB]
(?<create>declare %dx\.types\.Handle @dx\.op\.createHandle\([^\n]+\n)

[ShaderRegexDxilInjectedUavTest.DxilPatternB.Replace]
declare i32 @dx.op.atomicBinOp.i32(i32, %dx.types.Handle, i32, i32, i32, i32, i32) #2\n
${create}

[ShaderRegexDxilInjectedUavTest.DxilPatternC]
(?<head>!4 = !\{!5, )null(?<tail>, !9, !11\}\n)

[ShaderRegexDxilInjectedUavTest.DxilPatternC.Replace]
${head}!9000${tail}
!9000 = !{!9001}\n
!9001 = !{i32 0, %struct.RWByteAddressBuffer* undef, !"", i32 0, i32 4, i32 1, i32 11, i1 false, i1 false, i1 false, null}\n

[ShaderRegexDxilInjectedUavTest.DxilPatternD]
(?<entry>!14 = !\{void \(\)\* @ps, !"ps", !15, !4, )null(?<tail>\}\n)

[ShaderRegexDxilInjectedUavTest.DxilPatternD.Replace]
${entry}!9002${tail}
!9002 = !{i32 0, i64 16}\n
