[ResourceDxilRawUav]
type = RWByteAddressBuffer
format = R32_TYPELESS
array = 4

[ShaderRegexDxilRawUavTest]
shader_model = ps_6_0
dx12_match_registers = t0 t1
ps-u4 = ResourceDxilRawUav

[ShaderRegexDxilRawUavTest.InsertDeclarations]
dcl_uav_raw u4

[ShaderRegexDxilRawUavTest.DxilPatternA]
(?s)\A(?=.*define void @ps\(\)).*?\K(?<head>  call void @dx\.op\.storeOutput\.f32\(i32 5, i32 0, i32 0, i8 0, float )(?<value>%\d+)(?<tail>\).*?\n)

[ShaderRegexDxilRawUavTest.DxilPatternA.Replace]
%zz_test_old = call i32 @dx.op.atomicBinOp.i32(i32 78, %dx.types.Handle %zz_d3dmigoto_u4, i32 8, i32 0, i32 undef, i32 undef, i32 1)\n
%zz_test_set = icmp ne i32 %zz_test_old, 0\n
%zz_test_delta = select i1 %zz_test_set, float 0.5, float 0.0\n
%zz_test_output = fadd fast float ${value}, %zz_test_delta\n
${head}%zz_test_output${tail}

[ShaderRegexDxilRawUavTest.DxilPatternB]
(?<declaration>declare %dx\.types\.Handle @dx\.op\.createHandle\([^\n]+\n)

[ShaderRegexDxilRawUavTest.DxilPatternB.Replace]
declare i32 @dx.op.atomicBinOp.i32(i32, %dx.types.Handle, i32, i32, i32, i32, i32) #2\n
${declaration}
