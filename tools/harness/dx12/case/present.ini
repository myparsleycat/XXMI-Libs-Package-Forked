; For check.sh present: [Present] counts the frames and a compute shader
; writes a colour made of the count to the texture a mod's mesh is drawn with,
; so the picture of a frame tells how often [Present] took effect before it.
; Another compute shader adds to a texture every time it runs. With $present_bb
; [Present] also copies the swap chain's buffer, which a repeat runs again for.
[Constants]
global $present_frames = 0
global $present_bb = 0

[Present]
$present_frames = $present_frames + 1
x150 = $present_frames
run = CustomShaderPresentTint
run = CustomShaderPresentSum
if $present_bb
	ResourcePresentShot = copy bb
endif
post x151 = $present_frames

[ResourcePresentShot]

[ResourcePresentTint]
type = RWTexture2D
format = R8G8B8A8_UNORM
width = 4
height = 4
mips = 1
array = 1
msaa = 1

[ResourcePresentSum]
type = RWTexture2D
format = R32_FLOAT
width = 4
height = 4
mips = 1
array = 1
msaa = 1

[CustomShaderPresentTint]
cs = present-tint.hlsl
cs-u0 = ResourcePresentTint
dispatch = 1, 1, 1
cs-u0 = null

[CustomShaderPresentSum]
cs = present-sum.hlsl
cs-u0 = ResourcePresentSum
dispatch = 1, 1, 1
cs-u0 = null
