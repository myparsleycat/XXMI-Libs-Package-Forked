[ResourceSamplerPoint]
type = SamplerState
filter = point
address = wrap

[ResourceSamplerLinear]
type = SamplerState
filter = linear
address = clamp

[CommandListSamplerCustom]
run = CustomShaderSamplerLeft
run = CustomShaderSamplerRight

[CustomShaderSamplerLeft]
ps = sampler-custom-left.hlsl
ps-s15 = ResourceSamplerPoint
drawindexed = auto

[CustomShaderSamplerRight]
ps = sampler-custom-right.hlsl
ps-s15 = ResourceSamplerLinear
drawindexed = auto
