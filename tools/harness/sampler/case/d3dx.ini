[Loader]
target = harness.exe

[Logging]
log_level = info
show_warnings = 1
unbuffered = 1

[System]
allow_check_interface = 1
allow_create_device = 1
allow_platform_update = 1

[Rendering]
extended_rendering = 0

[Hunting]
hunting = 0

[Constants]
global $sampler_slots = 0

[Present]
; Dropped by DLLs without sampler slots
$sampler_slots = dll_sampler_slots
run = CustomShaderCol0
run = CustomShaderCol1
run = CustomShaderCol2
run = CustomShaderCol3
run = CustomShaderCol4
run = CustomShaderCol5
run = CustomShaderCol6
run = CustomShaderCompute
run = CustomShaderRegion
ps-s3 = ResourceLinearClamp
ps-s3 = null
vs-s1 = ref ResourceAniso
hs-s0 = ResourceLinearClamp
ds-s0 = ResourceLinearClamp
gs-s15 = ResourceAll

[ResourceLinearClamp]
type = SamplerState

[ResourcePointClamp]
type = SamplerState
filter = point

[ResourceBorder]
type = SamplerState
filter = point
address = border
border_color = 0.25 0.25 0.25 0.25

[ResourceAniso]
type = SamplerState
filter = anisotropic

[ResourceAll]
type = SamplerState
filter = anisotropic
address_u = wrap
address = mirror
address_w = border
max_anisotropy = 4
mip_lod_bias = -0.5
min_lod = 1
max_lod = 2
comparison = less_equal
border_color = 0 0 0.5 1

[ResourceTex]
type = Texture2D
width = 4
height = 4
format = R8G8B8A8_UNORM

[ResourceBadKeys]
type = SamplerState
filter = trilinear
address = edge
max_anisotropy = 32
border_color = 1 2
filename = nothing.dds

[CustomShaderCol0]
vs = col0.hlsl
ps = col0.hlsl
topology = triangle_list
ps-s0 = ResourceLinearClamp
draw = 3, 0

[CustomShaderCol1]
vs = col1.hlsl
ps = col1.hlsl
topology = triangle_list
ps-s1 = ResourcePointClamp
draw = 3, 0

; Legacy key only: must behave as with earlier DLLs
[CustomShaderCol2]
vs = col2.hlsl
ps = col2.hlsl
topology = triangle_list
sampler = linear_filter
draw = 3, 0

; Legacy key and a ps-s0 line: the line wins
[CustomShaderCol3]
vs = col3.hlsl
ps = col3.hlsl
topology = triangle_list
sampler = point_filter
ps-s0 = ResourceLinearClamp
draw = 3, 0

[CustomShaderCol4]
vs = col4.hlsl
ps = col4.hlsl
topology = triangle_list
if $sampler_slots
	ps-s2 = ResourceLinearClamp
endif
draw = 3, 0

[CustomShaderCol5]
vs = col5.hlsl
ps = col5.hlsl
topology = triangle_list
ps-s0 = ResourceBorder
draw = 3, 0

[CustomShaderCol6]
vs = col6.hlsl
ps = col6.hlsl
topology = triangle_list
ps-s0 = ResourcePointClamp
ps-s0 = null
draw = 3, 0

[CustomShaderCompute]
cs = cs0.hlsl
cs-s0 = ResourceLinearClamp
dispatch = 1, 1, 1
post cs-s0 = null

[ResourceRegionSource]
type = Buffer
format = R32_FLOAT
data = 1 2 3 4 5 6 7 8

; The copies go straight to the slots, so the shader sees the views the copies
; make. A size past the end of the 32 byte source is clamped to it. cs-cb1 is
; the harness's 512 byte constant buffer, which has neither a format nor a
; structure.
[CustomShaderRegion]
cs = region.hlsl
cs-t1 = copy ResourceRegionSource->Region(16, 16)
cs-t2 = copy ResourceRegionSource->Region(0, 1024)
cs-t3 = ref ResourceRegionSource->Region(0, 16)
cs-t4 = ref ResourceRegionSource->Region(8, 8)
cs-cb0 = copy cs-cb1->Region(256, 256)
dispatch = 1, 1, 1

; Never run: each line has to be warned about when loading
[CommandListBad]
ps-s4 = ResourceTex
ps-s16 = ResourceLinearClamp
ps-s5 = copy ResourceLinearClamp
ps-s6 = ResourceMissing
ps-s7 = ResourceLinearClamp ResourcePointClamp
ResourceTex = ref ps-s0
ps-t5 = ResourceLinearClamp
ResourceTex = ref ResourceLinearClamp
ResourceLinearClamp = ref ResourceTex
