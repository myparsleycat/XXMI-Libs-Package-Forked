; A mod that notes what it found among the game's draws in a pool, acts on it
; in [Present] and forgets it by resetting the pool with post. The presents of
; frame generation have to find the key the frame's draws put there: one that
; does not empties the triangle for good, from the 20th frame on.
; Run as: sh try.sh fg_poolreset 3 --pool --generated 1 (without --generated
; it fails with any DLL, see fg_presentrepeat)
[Constants]
global $enable_mods = 1
ResourceTriangleVB = ref ResourceTestVB

[PoolDetection]
pool_size = 2
pool_index_type = fifo

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if $enable_mods
    if DRAW_TYPE % 2 == 0
        CheckTextureOverride = ib
    endif
endif

[ResourceTestVB]
type = Buffer
stride = 32
filename = tri_vb.buf

[ResourceZeroVB]
type = Buffer
stride = 32
filename = tri_zero.buf

[ResourceTriangleVB]

[ResourceTestIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = tri_ib.buf

[Present]
if FRAME_NUMBER >= 20 && $PoolDetection[42] != 1
    ResourceTriangleVB = ref ResourceZeroVB
endif
post PoolDetection = null

[TextureOverrideHarnessRegion]
hash = f9cebfae
match_index_count = 6
if DRAW_TYPE == 4
    $PoolDetection[42] = 1
    handling = skip
    vb0 = ref ResourceTriangleVB
    ib = ref ResourceTestIB
    drawindexedinstanced = 3, INSTANCE_COUNT, 0, 0, FIRST_INSTANCE
endif
