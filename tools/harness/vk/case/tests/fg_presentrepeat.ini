; A mod that finds something among the game's draws, acts on it in [Present]
; and forgets it with post, like a menu shown while its character is seen.
; Every present has to find it, also those of --generated N (frame
; generation): one that does not empties the triangle for good, from the 20th
; frame on. Run as: sh try.sh fg_presentrepeat 3 --pool --generated 1
; (without --generated the harness's D3D12 presents come late enough to run
; between the next frame's draws and its submission, and it fails with any DLL)
[Constants]
global $enable_mods = 1
global $detected = 0
ResourceTriangleVB = ref ResourceTestVB

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if $enable_mods
    if DRAW_TYPE % 2 == 0
        CheckTextureOverride = ib
    endif
endif

[ResourceTestVB]
type = Buffer
stride = 32
filename = tri_vb.buf

[ResourceZeroVB]
type = Buffer
stride = 32
filename = tri_zero.buf

[ResourceTriangleVB]

[ResourceTestIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = tri_ib.buf

[Present]
if FRAME_NUMBER >= 20 && $detected == 0
    ResourceTriangleVB = ref ResourceZeroVB
endif
post $detected = 0

[TextureOverrideHarnessRegion]
hash = f9cebfae
match_index_count = 6
if DRAW_TYPE == 4
    $detected = 1
    handling = skip
    vb0 = ref ResourceTriangleVB
    ib = ref ResourceTestIB
    drawindexedinstanced = 3, INSTANCE_COUNT, 0, 0, FIRST_INSTANCE
endif
