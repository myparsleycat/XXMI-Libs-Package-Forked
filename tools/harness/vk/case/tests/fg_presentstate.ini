; What a repeat of [Present] for a present of frame generation writes has to
; be gone after it: counters in a global, a local and a pool variable go up
; once per frame of the game together, and a reference that post sets free is
; free again before the next [Present]. Otherwise the triangle is emptied for
; good. Run as: sh try.sh fg_presentstate 3 --pool --generated 1
[Constants]
global $enable_mods = 1
global $g = 0
ResourceTriangleVB = ref ResourceTestVB

[Pool_Counter]
pool_size = 2
pool_variable_default_value = 0

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if $enable_mods
    if DRAW_TYPE % 2 == 0
        CheckTextureOverride = ib
    endif
endif

[ResourceTestVB]
type = Buffer
stride = 32
filename = tri_vb.buf

[ResourceZeroVB]
type = Buffer
stride = 32
filename = tri_zero.buf

[ResourceTriangleVB]

[ResourceSeed]
type = Buffer
stride = 32
filename = tri_vb.buf

[ResourceTemp]

[ResourceTestIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = tri_ib.buf

[Present]
local $l
if ResourceTemp !== null
    ResourceTriangleVB = ref ResourceZeroVB
endif
ResourceTemp = ref ResourceSeed
$g = $g + 1
$l = $l + 1
$Pool_Counter[0] = $Pool_Counter[0] + 1
if $l != $g || $Pool_Counter[0] != $g
    ResourceTriangleVB = ref ResourceZeroVB
endif
post ResourceTemp = null

[TextureOverrideHarnessRegion]
hash = f9cebfae
match_index_count = 6
if DRAW_TYPE == 4
    handling = skip
    vb0 = ref ResourceTriangleVB
    ib = ref ResourceTestIB
    drawindexedinstanced = 3, INSTANCE_COUNT, 0, 0, FIRST_INSTANCE
endif
