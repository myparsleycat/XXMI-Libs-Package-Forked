; check.sh filter: the texture bound after the snapshot is taken back.
; No game texture has a dHash in Vulkan, so the filter matches nothing.
[Constants]
global $enable_mods = 1

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if $enable_mods
    if DRAW_TYPE % 2 == 0
        CheckTextureOverride = ib
    endif
endif

[ResourceTestVB]
type = Buffer
stride = 32
filename = tri_vb.buf

[ResourceTestIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = tri_ib.buf

[ResourceTex]
filename = tex_rgba.dds

[FilterTest]
match_dhash = 1042084108210420

[TextureOverrideHarnessRegion]
hash = f9cebfae
match_index_count = 6
if DRAW_TYPE == 4
    handling = skip
    vb0 = ref ResourceTestVB
    ib = ref ResourceTestIB
    run = SnapshotInitialTextures
    ps-t0 = ResourceTex
    ps-t[FilterTest] = ref ResourceTex
    run = RestoreInitialTextures
    drawindexedinstanced = 3, INSTANCE_COUNT, 0, 0, FIRST_INSTANCE
endif
