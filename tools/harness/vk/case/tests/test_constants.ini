[Constants]
global $enable_mods = 1

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if $enable_mods
    if DRAW_TYPE % 2 == 0
        CheckTextureOverride = ib
    endif
endif

[ResourceTestVB]
type = Buffer
stride = 32
filename = tri_vb.buf

[ResourceTestIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = tri_ib.buf

[TextureOverrideHarnessRegion]
hash = f9cebfae
match_index_count = 6
if DRAW_TYPE == 4 && vs-cb0->Size == 128 && vs->cb_size(0) == 8 && vs->cb_size(1) == -1 && vs-cb0->SpatialHash(12, 13, 14, 0.125) == vs-cb0->SpatialHash(16, 17, 18, 0.125) && vs-cb0->SpatialHash(12, 13, 14, 0.125) != vs-cb0->SpatialHash(20, 21, 22, 0.125)
    handling = skip
    vb0 = ref ResourceTestVB
    ib = ref ResourceTestIB
    drawindexedinstanced = 3, INSTANCE_COUNT, 0, 0, FIRST_INSTANCE
endif
