[Constants]
global $enable_mods = 1

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if $enable_mods
    if DRAW_TYPE % 2 == 0
        CheckTextureOverride = ib
    endif
endif

[ResourceTestVB]
type = Buffer
stride = 36
filename = tri_vb16.buf

[ResourceTestIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = tri_ib.buf

[ResourceConfigRW]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 8

[ResourceBonesRW]
type = RWStructuredBuffer
stride = 16
array = 4

[ResourceGameConstants]
[ResourceGameBones]

[ResourceDumpedUAV]
type = RWStructuredBuffer
stride = 16
array = 8

[ResourceDumpedSRV]
type = StructuredBuffer
stride = 16
array = 8

[CustomShaderExtract]
vs = extract_vs.hlsl
ps = extract_ps.hlsl
ps-u7 = ResourceDumpedUAV
depth_enable = false
blend = ADD SRC_ALPHA INV_SRC_ALPHA
cull = none
topology = point_list
draw = 8, 0
ps-u7 = null
ResourceDumpedSRV = copy ResourceDumpedUAV

[CustomShaderFill]
cs = fill2.hlsl
cs-t0 = vs-t0
cs-t1 = ResourceDumpedSRV
cs-u0 = ref ResourceConfigRW
cs-u1 = ref ResourceBonesRW
dispatch = 1, 1, 1
cs-u0 = null
cs-u1 = null
cs-t0 = null
cs-t1 = null

[TextureOverrideHarnessRegion]
hash = f9cebfae
match_index_count = 6
if DRAW_TYPE == 4 && vs->srv_stride(0) == 16
    run = CustomShaderExtract
    run = CustomShaderFill
    vs-cb0 = copy ResourceConfigRW
    vs-t0 = ref ResourceBonesRW
    handling = skip
    vb0 = ref ResourceTestVB
    vb0->ElementFormat(BLENDINDICES, 0) = R16G16B16A16_UINT
    ib = ref ResourceTestIB
    drawindexedinstanced = 3, INSTANCE_COUNT, 0, 0, FIRST_INSTANCE
endif
