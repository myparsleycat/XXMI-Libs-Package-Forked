; The triangle is drawn for as long as every frame the game draws is one frame
; to FRAME_NUMBER, also with --generated N and --overlay (with --draws 2 or more),
; from the 20th on: before, the draws shown may be as few as the overlay has
[Constants]
global $enable_mods = 1
global $last_frame = -1
global $bad = 0

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if $enable_mods
    if DRAW_TYPE % 2 == 0
        CheckTextureOverride = ib
    endif
endif

[ResourceTestVB]
type = Buffer
stride = 32
filename = tri_vb.buf

[ResourceTestIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = tri_ib.buf

[TextureOverrideHarnessRegion]
hash = f9cebfae
match_index_count = 6
if DRAW_TYPE == 4
    if $last_frame >= 20 && FRAME_NUMBER != $last_frame && FRAME_NUMBER - $last_frame != 1
        $bad = 1
    endif
    $last_frame = FRAME_NUMBER
    handling = skip
    if $bad == 0
        vb0 = ref ResourceTestVB
        ib = ref ResourceTestIB
        drawindexedinstanced = 3, INSTANCE_COUNT, 0, 0, FIRST_INSTANCE
    endif
endif

; Shows the engine the 3 index draw of --overlay, which is no frame of the game
[TextureOverrideHarnessOverlayCount]
hash = 0badf00d
match_index_count = 3
