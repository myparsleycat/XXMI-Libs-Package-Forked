[Constants]
global $enable_mods = 1

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if $enable_mods
    if DRAW_TYPE % 2 == 0
        CheckTextureOverride = ib
    endif
endif

[ResourceTestVB]
type = Buffer
stride = 32
filename = tri_vb.buf

[ResourceZeroVB]
type = Buffer
stride = 32
filename = tri_zero.buf

[ResourceVirtualVB]

[ResourceTestIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = tri_ib.buf

[CustomShaderBlend]
cs = blend.hlsl
cs-t50 = copy ResourceTestVB
dispatch = 3, 1, 1
ResourceVirtualVB = ref cs-u5

[TextureOverrideHarnessRegion]
hash = f9cebfae
match_index_count = 6
if DRAW_TYPE == 4
    handling = skip
    cs-u5 = copy ResourceZeroVB
    run = CustomShaderBlend
    cs-u5 = null
    vb0 = ref ResourceVirtualVB
    ib = ref ResourceTestIB
    drawindexedinstanced = 3, INSTANCE_COUNT, 0, 0, FIRST_INSTANCE
endif
