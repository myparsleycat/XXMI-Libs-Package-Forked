[Constants]
global $enable_mods = 1

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if $enable_mods
    if DRAW_TYPE % 2 == 0
        CheckTextureOverride = ib
    endif
endif

[ResourceTestVB]
type = Buffer
stride = 32
filename = tri_vb.buf

[ResourceTestIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = tri_ib.buf

[TextureOverrideHarnessRegion]
hash = f9cebfae
match_index_count = 6
if DRAW_TYPE == 4 && vs == 200
    handling = skip
    vb0 = ref ResourceTestVB
    ib = ref ResourceTestIB
    drawindexedinstanced = 3, INSTANCE_COUNT, 0, 0, FIRST_INSTANCE
endif

[ShaderRegexClassify]
shader_model = vs_5_0
filter_index = 200

[ShaderRegexClassify.Pattern]
dcl_constantbuffer CB0\[7\], immediateIndexed\n(?:dcl_[^\n]*\n)*?dcl_resource_structured t0, 16\n(?:dcl_[^\n]*\n)*?dcl_input v2\.xyzw\ndcl_output_siv o0\.xyzw, position\ndcl_output o1\.xyzw\ndcl_temps \d+\n
